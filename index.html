<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>THE LAST ARK · 最后的方舟</title>
  </head>
  <body>
    <main>
      <header><h1>THE LAST ARK <small>最后的方舟 · 物理原型 01</small></h1><span>双人同屏 / 共享键盘</span></header>
      <p id="telemetry" role="status" aria-live="off"></p>
      <canvas id="game" width="1100" height="620" tabindex="0" aria-label="双人引力护航游戏。WASD 和方向键移动，F 切换吸引，Enter 切换排斥，空格开始或暂停，R 重试。"></canvas>
      <div class="controls"><span><b class="blue">P1 吸引</b> WASD 移动 · F 开 / 关</span><span><b class="gold">P2 排斥</b> 方向键移动 · Enter 开 / 关</span><span>Space 开始 / 暂停 / 继续 · R 重试</span></div>
      <p class="hint">虚线实时演算未来最多 12 秒：包含所有天体运动和引力，假定玩家保持当前位置与技能开关。红色终点表示危险，绿色表示安全入港。暂停也可移动玩家、切换技能来规划路线。</p>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
