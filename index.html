<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>THE LAST ARK · 最后的方舟</title>
  </head>
  <body>
    <main>
      <header><h1>THE LAST ARK <small>最后的方舟 · 物理原型 01</small></h1><span>双人同屏 / 共享键盘</span></header>
      <p id="telemetry" role="status" aria-live="off"></p>
      <canvas id="game" width="1100" height="620" tabindex="0" aria-label="双人引力护航游戏。WASD 和方向键移动，F 吸引，Enter 排斥，空格开始或暂停，R 重试。"></canvas>
      <div class="controls"><span><b class="blue">P1 吸引</b> WASD 移动 · 按住 F</span><span><b class="gold">P2 排斥</b> 方向键移动 · 按住 Enter</span><span>Space 开始 / 暂停 / 继续 · R 重试</span></div>
      <p class="hint">合作提示：先绕开中央天体，再从飞船前方排斥制动。暂停时可移动玩家规划下一步；空间港要求整艘飞船进入且速度 ≤ 48。虚线仅示意当前惯性方向，不预测引力轨迹。</p>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
