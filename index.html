<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>THE LAST ARK · 最后的方舟</title>
  </head>
  <body>
    <main>
      <header><h1>THE LAST ARK <small>最后的方舟 · 世界架构原型</small></h1><span>双人同屏 / 共享键盘</span></header>
      <p id="telemetry" role="status" aria-live="off"></p>
      <button id="start" type="button">进入原试玩关</button><canvas id="game" width="1100" height="620" tabindex="0" aria-label="双人引力护航游戏。WASD 和方向键移动，F 切换吸引，Enter 切换排斥，空格开始或暂停，R 重试。"></canvas>
      <div class="controls"><span><b class="blue">P1 吸引</b> WASD 移动 · F 开 / 关</span><span><b class="gold">P2 排斥</b> 方向键移动 · Enter 开 / 关</span><span>Space 开始 / 暂停 / 继续 · R 检查点 / Shift+R 从头开始 · Esc 标题 · − / + 缩放，0 复位</span></div>
      <p class="hint">控制节点会加速移动，松键后柔和制动；技能可在移动中使用。大天体也能推拉，离开有效力场后逐渐消除玩家造成的速度扰动。虚线演算未来最多 12 秒，假定玩家松开移动键并保持技能开关；包含辅助制动、天体稳定机制和引力。红色表示危险，绿色表示安全入港。暂停也可规划。</p>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
